<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Gadget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Calendar</span>
        </div>
        <div class="titlebar-actions">
          <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path
                d="M19.4 13a7.7 7.7 0 0 0 .05-2l2-1.15-2-3.46-2.3.75a7.6 7.6 0 0 0-1.73-1L15 4h-4l-.42 2.14a7.6 7.6 0 0 0-1.73 1L6.55 6.4l-2 3.46 2 1.15a7.7 7.7 0 0 0 0 2l-2 1.15 2 3.46 2.3-.75a7.6 7.6 0 0 0 1.73 1L11 20h4l.42-2.14a7.6 7.6 0 0 0 1.73-1l2.3.75 2-3.46-2-1.15Z"
              />
            </svg>
          </button>
          <button id="btn-minimize" class="icon-btn" type="button" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button id="btn-close" class="icon-btn danger" type="button" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="clock-block">
          <p id="clock-time" class="clock-time">--:--:--</p>
          <p id="clock-date" class="clock-date">—</p>
        </section>

        <section class="calendar-block">
          <div class="month-nav">
            <button id="prev-month" class="nav-btn" type="button" aria-label="Previous month">‹</button>
            <h1 id="month-label" class="month-label">Month</h1>
            <button id="next-month" class="nav-btn" type="button" aria-label="Next month">›</button>
          </div>
          <div id="weekday-row" class="weekday-row"></div>
          <div id="day-grid" class="day-grid"></div>
          <button id="btn-today" class="today-btn" type="button">Today</button>
        </section>
      </main>

      <aside id="schedule-panel" class="overlay-panel" hidden>
        <div class="overlay-header">
          <div>
            <p class="overlay-kicker">Meeting</p>
            <h2 id="schedule-date-label">Date</h2>
          </div>
          <button id="btn-schedule-close" class="icon-btn" type="button" aria-label="Close meeting panel">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <ul id="schedule-list" class="schedule-list"></ul>

        <form id="schedule-form" class="schedule-form">
          <label class="field">
            <span>Title</span>
            <input id="schedule-title" type="text" maxlength="120" required placeholder="Meeting title" />
          </label>
          <label class="field">
            <span>Description</span>
            <textarea id="schedule-notes" rows="4" maxlength="500" placeholder="Meeting description"></textarea>
          </label>
          <p id="schedule-error" class="form-error" hidden></p>
          <button class="primary-btn" type="submit">Add meeting</button>
        </form>
      </aside>

      <aside id="settings-panel" class="overlay-panel settings-panel" hidden>
        <div class="overlay-header">
          <h2>Settings</h2>
          <button id="btn-settings-close" class="icon-btn" type="button" aria-label="Close settings">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <label class="field">
          <span>Opacity</span>
          <div class="field-row">
            <input id="opacity-range" type="range" min="20" max="100" step="1" />
            <output id="opacity-value">92%</output>
          </div>
        </label>

        <label class="field">
          <span>Week starts on</span>
          <select id="week-start">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
          </select>
        </label>

        <label class="field">
          <span>Window size</span>
          <div class="size-controls">
            <label>
              W
              <input id="size-width" type="number" min="260" max="420" step="10" />
            </label>
            <label>
              H
              <input id="size-height" type="number" min="360" max="600" step="10" />
            </label>
            <button id="apply-size" class="apply-btn" type="button">Apply</button>
          </div>
          <p id="size-hint" class="hint">Size is limited. You can also drag the window edges.</p>
        </label>

        <label class="field">
          <span>Display time zone</span>
          <input id="timezone-filter" type="search" placeholder="Search time zones…" autocomplete="off" />
          <select id="timezone" size="8"></select>
          <p class="hint">Sorted by current local time (UTC offset). Changes only the clock display.</p>
        </label>
      </aside>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
